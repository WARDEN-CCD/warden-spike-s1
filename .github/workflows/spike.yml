name: spike-s1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  IMAGE: ghcr.io/warden-ccd/warden-spike-s1
  KIND_VERSION: v0.33.0
  KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  KYVERNO_CHART_VERSION: 3.9.2

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      signed: ${{ steps.push.outputs.signed }}
      unsigned: ${{ steps.push.outputs.unsigned }}
      foreign: ${{ steps.push.outputs.foreign }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push three variants
        id: push
        run: |
          set -euo pipefail
          for v in signed unsigned foreign; do
            tag="$IMAGE:$v-${GITHUB_SHA::7}"
            docker build --build-arg VARIANT="$v" -t "$tag" .
            docker push "$tag"
            ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$tag")
            echo "$v=$ref" | tee -a "$GITHUB_OUTPUT"
          done

  sign:
    needs: build
    uses: ./.github/workflows/sign.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image-ref: ${{ needs.build.outputs.signed }}

  foreign-sign:
    # Valid Fulcio cert, wrong identity: this job is not the reusable signer (attack A03).
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      FOREIGN: ${{ needs.build.outputs.foreign }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: cosign sign --yes "$FOREIGN"

  verify:
    needs: [build, sign, foreign-sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      SIGNED: ${{ needs.build.outputs.signed }}
      UNSIGNED: ${{ needs.build.outputs.unsigned }}
      FOREIGN: ${{ needs.build.outputs.foreign }}
      GH_TOKEN: ${{ github.token }}
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: CLI evidence (Q3, Q4, Q5) and referrer layout (Q1)
        run: |
          set +e -uo pipefail   # expected failures (unsigned/foreign) must not abort the step
          mkdir -p out
          rc() { echo "$1: exit $2" | tee -a out/cli-exit-codes.txt; }
          for v in SIGNED UNSIGNED FOREIGN; do
            cosign verify "${!v}" --certificate-oidc-issuer "$ISSUER" --certificate-identity-regexp '.*' \
              --output json > "out/cosign-verify-${v,,}.json" 2> "out/cosign-verify-${v,,}.err"
            rc "cosign verify ${v,,}" $?
          done
          for t in slsaprovenance1 cyclonedx vuln; do
            cosign verify-attestation "$SIGNED" --type "$t" --certificate-oidc-issuer "$ISSUER" \
              --certificate-identity-regexp '.*' > "out/att-$t.json" 2> "out/att-$t.err"
            rc "cosign verify-attestation $t" $?
          done
          gh attestation verify "oci://$SIGNED" --owner WARDEN-CCD --format json \
            > out/gh-attestation.json 2> out/gh-attestation.err
          rc "gh attestation verify" $?

          name="${SIGNED%@*}"; repo="${name#ghcr.io/}"; digest="${SIGNED#*@}"
          tok=$(curl -sS -u "${GITHUB_ACTOR}:${GH_TOKEN}" "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r .token)
          accept='Accept: application/vnd.oci.image.index.v1+json'
          curl -sS -H "Authorization: Bearer $tok" -H "$accept" "https://ghcr.io/v2/${repo}/referrers/${digest}" > out/referrers-api.json
          curl -sS -H "Authorization: Bearer $tok" -H "$accept" "https://ghcr.io/v2/${repo}/manifests/sha256-${digest#sha256:}" > out/referrers-fallback-tag.json
          curl -sS -H "Authorization: Bearer $tok" "https://ghcr.io/v2/${repo}/tags/list" > out/tags.json

          {
            echo "## CLI evidence"
            echo '```'; cat out/cli-exit-codes.txt; echo '```'
            echo "### Certificate subject (reusable signer) — Q4"
            echo '```'
            jq -r '.[0].verificationResult.signature.certificate.subjectAlternativeName // "n/a"' out/gh-attestation.json 2>/dev/null
            jq -r '.[0].optional.Subject // "n/a"' out/cosign-verify-signed.json 2>/dev/null
            echo '```'
            echo "### Provenance externalParameters — Q5"
            echo '```json'
            jq '.[0].verificationResult.statement.predicate.buildDefinition.externalParameters' out/gh-attestation.json 2>/dev/null
            echo '```'
            echo "### Referrers: API vs fallback tag — Q1"
            echo '```'
            echo "API manifests: $(jq '.manifests | length' out/referrers-api.json 2>/dev/null)"
            echo "Fallback-tag manifests: $(jq '.manifests | length' out/referrers-fallback-tag.json 2>/dev/null)"
            jq -r '.manifests[]? | "\(.artifactType)  \(.annotations["dev.sigstore.bundle.predicateType"] // "")"' out/referrers-fallback-tag.json 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: kind (Kubernetes 1.37) + Kyverno
        run: |
          set -euo pipefail
          curl -sSfLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          curl -sSfLo kind.sha256sum "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          echo "$(cut -d' ' -f1 kind.sha256sum)  kind" | sha256sum --check
          chmod +x kind && sudo mv kind /usr/local/bin/kind
          kind create cluster --name s1 --image "$KIND_NODE_IMAGE" --wait 180s
          helm repo add kyverno https://kyverno.github.io/kyverno
          helm install kyverno kyverno/kyverno --version "$KYVERNO_CHART_VERSION" \
            --namespace kyverno --create-namespace --wait --timeout 10m
          kubectl -n kyverno get deploy -o wide | tee out/kyverno-deployments.txt

      - name: Admission tests (Q1, Q2, Q3)
        run: |
          set +e -uo pipefail   # expected failures (unsigned/foreign) must not abort the step
          kubectl -n kyverno create secret docker-registry ghcr-creds \
            --docker-server=ghcr.io --docker-username="$GITHUB_ACTOR" --docker-password="$GH_TOKEN"
          bash scripts/admission-tests.sh "$SIGNED" "$UNSIGNED" "$FOREIGN" > out/admission.json
          {
            echo "## Admission results (expected: signed=admit, unsigned=deny, foreign=deny)"
            echo "| policy | image | verdict | expected | message |"
            echo "|---|---|---|---|---|"
            jq -r '.[] | "| \(.policy) | \(.image) | \(.verdict) | \(.expected) | \(.message | gsub("\\|"; "/") | .[0:220]) |"' out/admission.json
          } >> "$GITHUB_STEP_SUMMARY"
          jq -e 'all(.[]; .verdict == .expected)' out/admission.json > /dev/null \
            && echo "ALL AS EXPECTED" | tee -a "$GITHUB_STEP_SUMMARY" \
            || echo "MISMATCHES FOUND — see table" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Collect cluster state
        if: always()
        run: |
          mkdir -p out
          kubectl get imagevalidatingpolicies -o yaml > out/ivpol-status.yaml 2>&1 || true
          kubectl -n kyverno logs deploy/kyverno-admission-controller --tail=400 > out/kyverno-admission.log 2>&1 || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spike-s1-evidence
          path: out/
          retention-days: 30
