# Spike S1 variant "prov-pred" — applies only to namespace s1-prov-pred (label spike=prov-pred).
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: s1-prov-pred
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  evaluation:
    background:
      enabled: false
  credentials:
    secrets: [ghcr-creds]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        spike: "prov-pred"
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "ghcr.io/warden-ccd/*"
  validationConfigurations:
    mutateDigest: false
    verifyDigest: true
    required: true
  attestors:
    - name: signer
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: '^https://github\.com/WARDEN-CCD/warden-spike-s1/\.github/workflows/sign\.yml@refs/heads/main$'
        ctlog:
          url: https://rekor.sigstore.dev
  attestations:
    - name: provenance
      intoto:
        type: https://slsa.dev/provenance/v1
  validations:
    - message: "provenance attestation missing or wrong signer"
      expression: >-
        images.containers.map(image, verifyAttestationSignatures(image, attestations.provenance, [attestors.signer])).all(e, e > 0)
    - message: "Q2/predicate-root: provenance repository or ref mismatch"
      expression: >-
        images.containers.map(image,
          extractPayload(image, attestations.provenance).buildDefinition.externalParameters.workflow.repository == 'https://github.com/WARDEN-CCD/warden-spike-s1'
          && extractPayload(image, attestations.provenance).buildDefinition.externalParameters.workflow.ref == 'refs/heads/main').all(e, e)
